name: Branch Name Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  validate-branch-name:
    runs-on: ubuntu-latest
    steps:
      - name: Check branch naming convention
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          PATTERN="^(test|ci|fix|docs|chore)/.+"

          if [[ "$HEAD_REF" =~ $PATTERN ]]; then
            echo "Branch name '$HEAD_REF' follows convention."
            exit 0
          else
            echo "::error::Branch '$HEAD_REF' does not follow our naming convention."
            echo ""
            echo "Our branches must start with one of: test/, ci/, fix/, docs/, chore/"
            echo ""
            echo "Example: fix/login-null-check"
            echo ""
            echo "Rename your branch, e.g.:"
            echo "  git branch -m $HEAD_REF fix/$HEAD_REF"
            echo "  git push origin -u fix/$HEAD_REF"
            echo "  git push origin --delete $HEAD_REF"
            exit 1
          fi